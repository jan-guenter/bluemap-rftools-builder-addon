// SPDX-License-Identifier: MIT

plugins {
    id 'java-library'
    id 'checkstyle'
    id 'maven-publish'
    id 'io.github.janguenter.bluemap-addon.java-conventions'
}

group = addon_group
version = addon_version

base {
    archivesName = artifact_id
}

sourceSets {
    main.java.srcDir 'modules/bluemap-addon-adapter-api/src/main/java'
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://repo.bluecolored.de/releases')
        content { includeGroupByRegex('de\\.bluecolored.*') }
    }
}

dependencies {
    compileOnly "de.bluecolored:bluemap-core:${bluemap_version}"
    compileOnly 'org.jetbrains:annotations:23.0.0'
    testImplementation "de.bluecolored:bluemap-core:${bluemap_version}"
    testImplementation 'org.jetbrains:annotations:23.0.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.debug = true
    options.debugOptions.debugLevel = 'source,lines'
}

tasks.withType(Zip).configureEach {
    entryCompression = ZipEntryCompression.STORED
}

tasks.named('test', Test).configure {
    def exactJar = providers.gradleProperty('rftoolsBuilderJar')
    if (exactJar.isPresent()) {
        systemProperty 'rftoolsBuilderJar', exactJar.get()
    }
}

tasks.named('jar', Jar).configure {
    includeEmptyDirs = false
    manifest {
        attributes(
                'Automatic-Module-Name': 'io.github.janguenter.bluemap.rftoolsbuilder',
                'Implementation-Title': addon_name,
                'Implementation-Version': project.version.toString()
        )
    }
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-rftools-builder-addon' }
    }
    from('LICENSE-BlueMap') { into 'META-INF' }
    from('modules/bluemap-addon-adapter-api/LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-addon-adapter-api' }
    }
    from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-rftools-builder-addon.md' }
    }
    from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-rftools-builder-addon.md' }
    }
    from('provenance/upstreams.json') { into 'META-INF/bluemap-rftoolsbuilder' }
}

tasks.named('sourcesJar', Jar).configure {
    includeEmptyDirs = false
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-rftools-builder-addon' }
    }
    from('LICENSE-BlueMap') { into 'META-INF' }
    from('modules/bluemap-addon-adapter-api/LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-addon-adapter-api' }
    }
    from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-rftools-builder-addon.md' }
    }
    from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-rftools-builder-addon.md' }
    }
    from('provenance/upstreams.json') { into 'META-INF/bluemap-rftoolsbuilder' }
}

def productionJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def publishedSourcesJar = tasks.named('sourcesJar', Jar).flatMap { it.archiveFile }
def sharedAdapterApiPackage =
        'io/github/janguenter/bluemap/addon/adapter/api/bluemap523/'
def sharedAdapterApiClasses = [
        "${sharedAdapterApiPackage}BlueMapRuntimeCompatibility.class",
        "${sharedAdapterApiPackage}RegistryGuard.class",
        "${sharedAdapterApiPackage}ResourceExtensionType.class",
        "${sharedAdapterApiPackage}SyntheticDispatch.class"
].collect { it.toString() }
def sharedAdapterApiSources = [
        "${sharedAdapterApiPackage}BlueMapRuntimeCompatibility.java",
        "${sharedAdapterApiPackage}RegistryGuard.java",
        "${sharedAdapterApiPackage}ResourceExtensionType.java",
        "${sharedAdapterApiPackage}SyntheticDispatch.java"
].collect { it.toString() }
def legacyLocalAdapterPackage =
        'io/github/janguenter/bluemap/rftoolsbuilder/adapter/bluemap522/'

tasks.register('verifyAcceptedProductionJar') {
    dependsOn tasks.named('jar')
    inputs.file(productionJar)
    doLast {
        def jarFile = inputs.files.singleFile
        def expectedSize = providers.gradleProperty('accepted_jar_size').get().toLong()
        def expectedSha256 = providers.gradleProperty('accepted_jar_sha256').get()
        def actualSha256 = java.security.MessageDigest.getInstance('SHA-256')
                .digest(jarFile.bytes)
                .encodeHex()
                .toString()
        if (jarFile.length() != expectedSize || actualSha256 != expectedSha256) {
            throw new GradleException(
                    "Accepted production JAR mismatch: ${jarFile.length()} bytes, "
                            + "SHA-256 ${actualSha256}"
            )
        }
    }
}

tasks.register('verifyAcceptedSourcesJar') {
    dependsOn tasks.named('sourcesJar')
    inputs.file(publishedSourcesJar)
    doLast {
        def jarFile = inputs.files.singleFile
        def expectedSize = providers.gradleProperty('accepted_sources_jar_size').get().toLong()
        def expectedSha256 = providers.gradleProperty('accepted_sources_jar_sha256').get()
        def actualSha256 = java.security.MessageDigest.getInstance('SHA-256')
                .digest(jarFile.bytes)
                .encodeHex()
                .toString()
        if (jarFile.length() != expectedSize || actualSha256 != expectedSha256) {
            throw new GradleException(
                    "Accepted sources JAR mismatch: ${jarFile.length()} bytes, "
                            + "SHA-256 ${actualSha256}"
            )
        }
    }
}

tasks.register('verifyPinnedArtifact') {
    def exactJar = providers.gradleProperty('rftoolsBuilderJar')
    inputs.property('expectedSize', 1054852L)
    inputs.property('expectedSha256',
            '802cea7c7eb5d6a25d820113bdd9f59fe0c15b390265b4964a46dcf024cdffa6')
    if (exactJar.isPresent()) {
        inputs.file(exactJar)
    }
    doLast {
        if (!exactJar.isPresent()) {
            throw new GradleException(
                    'Set -PrftoolsBuilderJar to the exact All the Mons 1.2.0 RFToolsBuilder JAR.'
            )
        }
        def jarFile = file(exactJar.get())
        def digest = java.security.MessageDigest.getInstance('SHA-256')
                .digest(jarFile.bytes).encodeHex().toString()
        if (jarFile.length() != 1054852L
                || digest != '802cea7c7eb5d6a25d820113bdd9f59fe0c15b390265b4964a46dcf024cdffa6') {
            throw new GradleException(
                    "Pinned RFToolsBuilder artifact mismatch: ${jarFile.length()} bytes, ${digest}"
            )
        }
    }
}

tasks.register('verifyProductionJar') {
    dependsOn tasks.named('jar')
    inputs.file(productionJar)
    doLast {
        def zip = new java.util.zip.ZipFile(inputs.files.singleFile)
        try {
            def entries = zip.entries().findAll { !it.directory }.collect { it.name }
            def required = [
                    'bluemap.addon.json',
                    'assets/bluemap_rftoolsbuilder/blockstates/shield.json',
                    'bluemap-rftools-builder/profiles/rftoolsbuilder/1.21-7.0.5/profile.json',
                    'META-INF/LICENSE-bluemap-rftools-builder-addon',
                    'META-INF/LICENSE-BlueMap',
                    'META-INF/LICENSE-bluemap-addon-adapter-api',
                    'META-INF/NOTICE-bluemap-rftools-builder-addon.md',
                    'META-INF/THIRD_PARTY-bluemap-rftools-builder-addon.md',
                    'META-INF/bluemap-rftoolsbuilder/upstreams.json'
            ] + sharedAdapterApiClasses
            def missing = required.findAll { !entries.contains(it) }
            def duplicateShared = sharedAdapterApiClasses.findAll { shared ->
                entries.count { it == shared } != 1
            }
            if (!missing.isEmpty() || !duplicateShared.isEmpty()) {
                throw new GradleException(
                        "Production JAR shared boundary mismatch: missing=${missing}, "
                                + "nonUnique=${duplicateShared}"
                )
            }
            def addon = new groovy.json.JsonSlurper().parseText(
                    zip.getInputStream(zip.getEntry('bluemap.addon.json')).getText('UTF-8')
            )
            if (addon.id != addon_id
                    || addon.entrypoint
                            != 'io.github.janguenter.bluemap.rftoolsbuilder.BlueMapRftoolsBuilderAddon'
                    || addon.version != project.version.toString()
                    || addon.dependencies != [] || addon['soft-dependencies'] != []) {
                throw new GradleException('BlueMap add-on metadata mismatch')
            }
            def forbidden = entries.findAll {
                it.endsWith('.jar')
                        || (it.endsWith('.class')
                        && !it.startsWith('io/github/janguenter/bluemap/rftoolsbuilder/')
                        && !sharedAdapterApiClasses.contains(it))
                        || it == 'META-INF/neoforge.mods.toml'
                        || it == 'fabric.mod.json'
                        || it.endsWith('.mixins.json')
                        || it.startsWith('net/minecraft/')
                        || it.startsWith('net/neoforged/')
                        || it.startsWith('mcjty/')
                        || it.startsWith('de/bluecolored/')
                        || it.startsWith('assets/rftoolsbuilder/')
                        || it.startsWith('gallery/')
                        || (it.startsWith(legacyLocalAdapterPackage) && !it.endsWith('/'))
                        || (it.startsWith(sharedAdapterApiPackage) && !it.endsWith('/')
                            && !sharedAdapterApiClasses.contains(it))
                        || it.endsWith('.png')
                        || it.endsWith('.mcmeta')
            }
            if (!forbidden.isEmpty()) {
                throw new GradleException("Production JAR contains forbidden entries: ${forbidden}")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('verifySourcesJar') {
    dependsOn tasks.named('sourcesJar')
    inputs.file(publishedSourcesJar)
    doLast {
        def zip = new java.util.zip.ZipFile(inputs.files.singleFile)
        try {
            def entries = zip.entries().findAll { !it.directory }.collect { it.name }
            def required = [
                    'io/github/janguenter/bluemap/rftoolsbuilder/BlueMapRftoolsBuilderAddon.java',
                    'io/github/janguenter/bluemap/rftoolsbuilder/adapter/bluemap523/ShieldCubeEmitter.java',
                    'bluemap.addon.json',
                    'assets/bluemap_rftoolsbuilder/blockstates/shield.json',
                    'bluemap-rftools-builder/profiles/rftoolsbuilder/1.21-7.0.5/profile.json',
                    'META-INF/LICENSE-bluemap-rftools-builder-addon',
                    'META-INF/LICENSE-BlueMap',
                    'META-INF/LICENSE-bluemap-addon-adapter-api',
                    'META-INF/NOTICE-bluemap-rftools-builder-addon.md',
                    'META-INF/THIRD_PARTY-bluemap-rftools-builder-addon.md',
                    'META-INF/bluemap-rftoolsbuilder/upstreams.json'
            ] + sharedAdapterApiSources
            def missing = required.findAll { !entries.contains(it) }
            def duplicateShared = sharedAdapterApiSources.findAll { shared ->
                entries.count { it == shared } != 1
            }
            def projectJava = entries.findAll { it.endsWith('.java') }
            def foreignJava = projectJava.findAll {
                !it.startsWith('io/github/janguenter/bluemap/rftoolsbuilder/')
                        && !sharedAdapterApiSources.contains(it)
            }
            def forbidden = entries.findAll {
                it.endsWith('.class')
                        || it.endsWith('.jar')
                        || it.endsWith('.png')
                        || it.startsWith('assets/rftoolsbuilder/')
                        || it.startsWith('mcjty/')
                        || it.startsWith('de/bluecolored/')
                        || it.startsWith('net/minecraft/')
                        || it.startsWith('net/neoforged/')
                        || it.startsWith('gallery/')
                        || (it.startsWith(legacyLocalAdapterPackage) && !it.endsWith('/'))
                        || (it.startsWith(sharedAdapterApiPackage) && !it.endsWith('/')
                            && !sharedAdapterApiSources.contains(it))
            }
            if (!missing.isEmpty() || !duplicateShared.isEmpty()
                    || projectJava.isEmpty() || !foreignJava.isEmpty()
                    || !forbidden.isEmpty()) {
                throw new GradleException(
                        "Sources JAR boundary mismatch: missing=${missing}, "
                                + "nonUnique=${duplicateShared}, foreignJava=${foreignJava}, "
                                + "forbidden=${forbidden}"
                )
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyAcceptedProductionJar')
    dependsOn tasks.named('verifyAcceptedSourcesJar')
    dependsOn tasks.named('verifyPinnedArtifact')
    dependsOn tasks.named('verifyProductionJar')
    dependsOn tasks.named('verifySourcesJar')
}

tasks.register('verifyPublicationArtifacts') {
    dependsOn tasks.named('generatePomFileForAddonPublication')
    dependsOn tasks.named('generateMetadataFileForAddonPublication')
    doLast {
        def artifacts = [
                [file('build/publications/addon/pom-default.xml'),
                 providers.gradleProperty('accepted_pom_size').get().toLong(),
                 providers.gradleProperty('accepted_pom_sha256').get()],
                [file('build/publications/addon/module.json'),
                 providers.gradleProperty('accepted_module_size').get().toLong(),
                 providers.gradleProperty('accepted_module_sha256').get()]
        ]
        artifacts.each { artifact, expectedSize, expectedSha256 ->
            def actualSha256 = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(artifact.bytes)
                    .encodeHex()
                    .toString()
            if (artifact.length() != expectedSize || actualSha256 != expectedSha256) {
                throw new GradleException(
                        "Publication artifact mismatch for ${artifact}: "
                                + "${artifact.length()} bytes, SHA-256 ${actualSha256}"
                )
            }
        }
        def pom = file('build/publications/addon/pom-default.xml').text
        def module = new groovy.json.JsonSlurper().parse(
                file('build/publications/addon/module.json')
        )
        if (!pom.contains("<version>${project.version}</version>")
                || module.component.version != project.version.toString()
                || project.version.toString().endsWith('-SNAPSHOT')) {
            throw new GradleException('Publication metadata is not the final release version')
        }
    }
}

tasks.register('verifyReleaseMetadata') {
    doLast {
        def expectedTag = "v${project.version}"
        def requestedTag = providers.gradleProperty('releaseTag').getOrElse('')
        if (project.version.toString().endsWith('-SNAPSHOT')) {
            throw new GradleException('Release versions must not end in -SNAPSHOT')
        }
        if (requestedTag != expectedTag) {
            throw new GradleException(
                    "Release tag mismatch: ${requestedTag ?: '<unset>'} != ${expectedTag}"
            )
        }
    }
}

tasks.register('verifyReleaseCandidate') {
    dependsOn tasks.named('check')
    dependsOn tasks.named('verifyPinnedArtifact')
    dependsOn tasks.named('verifyPublicationArtifacts')
    dependsOn tasks.named('verifyReleaseMetadata')
}

publishing {
    publications {
        addon(MavenPublication) {
            from components.java
            artifactId = artifact_id
            pom {
                name = addon_name
                description = 'Exact-profile BlueMap rendering for RFToolsBuilder shield blocks.'
                url = 'https://github.com/jan-guenter/bluemap-rftools-builder-addon'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://spdx.org/licenses/MIT.html'
                        distribution = 'repo'
                    }
                }
                scm {
                    url = 'https://github.com/jan-guenter/bluemap-rftools-builder-addon'
                    connection = 'scm:git:https://github.com/jan-guenter/bluemap-rftools-builder-addon.git'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/jan-guenter/bluemap-rftools-builder-addon')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
