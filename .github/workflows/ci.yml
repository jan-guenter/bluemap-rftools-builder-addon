name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROMOTION_JAVA_VERSION: '21.0.12+8.0.LTS'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out add-on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read final release version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^addon_version=//p' gradle.properties)"
          test -n "${version}"
          [[ "${version}" != *-SNAPSHOT ]]
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check out exact BlueMap backport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jan-guenter/BlueMap
          ref: 9be321df995a1103808621d529eb72773e719d4d
          path: .ci/bluemap
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact detached BlueMap identities
        run: |
          test "$(git -C .ci/bluemap rev-parse --abbrev-ref HEAD)" = "HEAD"
          test "$(git -C .ci/bluemap rev-parse HEAD)" = \
            "9be321df995a1103808621d529eb72773e719d4d"
          test "$(git -C .ci/bluemap/api rev-parse HEAD)" = \
            "285c9a60eff3ac2b0cab308ce1058d1565be0971"
          git -C .ci/bluemap fetch --force --tags origin
          test "$(git -C .ci/bluemap describe --exact-match --tags HEAD)" = \
            "v5.22-agent.backport-5.22-mc1.21.1-2"

      - name: Set up exact promotion Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.PROMOTION_JAVA_VERSION }}

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.1'
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true

      - name: Acquire exact ephemeral RFToolsBuilder input
        run: |
          input_dir="${RUNNER_TEMP}/rftoolsbuilder-input"
          mkdir -p "${input_dir}"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/rftoolsbuilder-1.21-7.0.5.jar" \
            "https://www.curseforge.com/api/v1/mods/347706/files/8256217/download"
          test "$(stat -c %s \
            "${input_dir}/rftoolsbuilder-1.21-7.0.5.jar")" -eq 1054852
          sha256sum --check <<SHA256SUMS
          802cea7c7eb5d6a25d820113bdd9f59fe0c15b390265b4964a46dcf024cdffa6  ${input_dir}/rftoolsbuilder-1.21-7.0.5.jar
          SHA256SUMS

      - name: Verify gallery and provenance inputs
        run: |
          python3 -m json.tool provenance/upstreams.json >/dev/null
          python3 -m json.tool provenance/release.json >/dev/null
          python3 gallery/generate.py --check
          python3 gallery/lint.py
          (cd gallery && sha256sum --check SHA256SUMS)
          bash gallery/package.sh "${RUNNER_TEMP}/gallery-first.zip"
          bash gallery/package.sh "${RUNNER_TEMP}/gallery-second.zip"
          cmp "${RUNNER_TEMP}/gallery-first.zip" \
            "${RUNNER_TEMP}/gallery-second.zip"
          test "$(stat -c %s "${RUNNER_TEMP}/gallery-first.zip")" -eq 3551
          sha256sum --check <<SHA256SUMS
          67886fc6796f8bcf7e67c4245d355725a03f0d3c5fa953ca3c8facdf8a9b9988  ${RUNNER_TEMP}/gallery-first.zip
          SHA256SUMS

      - name: Build and verify final release candidate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          input_dir="${RUNNER_TEMP}/rftoolsbuilder-input"
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            -PrftoolsBuilderJar="${input_dir}/rftoolsbuilder-1.21-7.0.5.jar" \
            "-PreleaseTag=v${VERSION}" \
            clean check build generatePomFileForAddonPublication \
            generateMetadataFileForAddonPublication \
            verifyPublicationArtifacts verifyReleaseCandidate
          test "$(stat -c %s \
            "build/libs/bluemap-rftools-builder-addon-${VERSION}.jar")" -eq 65630
          test "$(stat -c %s \
            "build/libs/bluemap-rftools-builder-addon-${VERSION}-sources.jar")" -eq 46071
          test "$(stat -c %s build/publications/addon/pom-default.xml)" -eq 1378
          test "$(stat -c %s build/publications/addon/module.json)" -eq 2873
          sha256sum --check <<SHA256SUMS
          612f13ac5969282fba8aea986bda75225740858578caf1dc59fdd9a493046c2e  build/libs/bluemap-rftools-builder-addon-${VERSION}.jar
          151d339992c7a79cdc7098e28a1bc687d4d591bcec7234ce130ed448f67c2dc9  build/libs/bluemap-rftools-builder-addon-${VERSION}-sources.jar
          474907777785ec36ab0fecc385ac96b7941d2dd36864cf7d6c236b985956901d  build/publications/addon/pom-default.xml
          3212228e456c6a555afcf882608957a8ec2e89bce32362d19e77bc411523e5fc  build/publications/addon/module.json
          SHA256SUMS
          python3 tools/verify_staged_equivalence.py \
            --jar "build/libs/bluemap-rftools-builder-addon-${VERSION}.jar" \
            --entries provenance/accepted-staging-entries.sha256

      - name: Upload review outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bluemap-rftools-builder-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/publications/addon/pom-default.xml
            build/publications/addon/module.json
            build/reports/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed-build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bluemap-rftools-builder-failure-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/publications/addon/*.xml
            build/publications/addon/*.json
            build/reports/**
          if-no-files-found: warn
          retention-days: 3
